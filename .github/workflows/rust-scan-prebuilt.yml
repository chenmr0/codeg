name: Rust scan prebuilt npm package

# Like the community kernel matrix: compile on target runners, gate packaging
# on real parity, then collect prebuilds. This workflow DOES NOT publish or push.
on:
  workflow_dispatch: {}
  workflow_call: {}

permissions:
  contents: read

jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2022
            target: x86_64-pc-windows-msvc
            platform: win32-x64
          - runner: ubuntu-22.04
            target: x86_64-unknown-linux-musl
            platform: linux-x64
    runs-on: ${{ matrix.runner }}
    env:
      RUSTUP_TOOLCHAIN: stable
      CODEGRAPH_RUST_SCAN_EXPECT: '1'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Prepare build-only Rust toolchain
        run: rustup toolchain install stable --profile minimal --target ${{ matrix.target }}
      - run: npm ci
      - run: npm run build
      - run: cargo test --locked --manifest-path codegraph-scan/Cargo.toml
      - run: npm run build:rust-scan -- --target ${{ matrix.target }}
      - run: npm run test:rust-scan
      - run: npm run validate:rust-scan
      - run: node scripts/check-rust-scan-artifacts.mjs --require ${{ matrix.platform }}
      - name: Archive prebuild with executable permissions
        run: tar -cf rust-scan-${{ matrix.platform }}.tar -C dist/native-scan ${{ matrix.platform }}
      - uses: actions/upload-artifact@v4
        with:
          name: rust-scan-prebuilt-${{ matrix.platform }}
          path: rust-scan-${{ matrix.platform }}.tar
          if-no-files-found: error

  package:
    needs: native
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - run: npm ci
      - run: npm run build
      - uses: actions/download-artifact@v4
        with:
          pattern: rust-scan-prebuilt-*
          merge-multiple: true
          path: native-artifacts
      - name: Collect, verify and pack both supported platforms
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/native-scan release/native-npm
          for archive in native-artifacts/*.tar; do tar -xf "$archive" -C dist/native-scan; done
          npm run check:rust-scan
          npm pack --pack-destination release/native-npm
      - name: Install package with compiler paths removed and exercise default auto mode
        shell: bash
        run: npm run smoke:native-package -- release/native-npm/*.tgz
      - uses: actions/upload-artifact@v4
        with:
          name: codegraph-prebuilt-npm
          path: release/native-npm/*.tgz
          if-no-files-found: error
