[package]
name = "codegraph-macros"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false
description = "Stateless opt-in macro contribution scanner; TS remains the oracle"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = true
codegen-units = 1
strip = true
